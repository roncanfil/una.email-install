# DKIM Signing Configuration for UNA Email
# This module signs outgoing emails with DKIM

# Enable DKIM signing
enabled = true;

# Sign authenticated users and local networks
sign_authenticated = true;
sign_local = true;

# Use the domain from the From header
use_domain = "header";
use_esld = false;

# Allow signing with mismatched domains (useful for aliases)
allow_hdrfrom_mismatch = true;
allow_hdrfrom_mismatch_sign_networks = true;
allow_username_mismatch = true;

# Selector to use (matches the key filename pattern)
selector = "una";

# Path to DKIM keys directory
path = "/var/lib/rspamd/dkim/$selector.$domain.key";

# Key format
key_format = "file";

# Headers to sign (these are the most important headers).
# Colon-delimited string, not an array: Rspamd 4.1's dkim_signing rejects an
# array with "sign_headers in dkim_signing must be a colon-delimited string"
# and falls back to its own default list, so the array never signed these.
sign_headers = "from:to:subject:date:message-id:content-type:reply-to:cc";

# Fallback behavior - try the domain, then parent domains
try_fallback = true;

# Check if key exists before signing
check_pubkey = false;

# Domain-specific configurations can be added here
# Example:
# domain {
#   example.com {
#     selector = "una";
#     path = "/var/lib/rspamd/dkim/una.example.com.key";
#   }
# }
