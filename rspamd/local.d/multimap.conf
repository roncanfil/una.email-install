# Sender rules, fed live from UNA.
#
# The web app serves the *global* rules as one plain-text pattern per line;
# Rspamd re-reads each map every map_watch_interval (1min, set in options.inc),
# so a rule added in the UI takes effect within a minute. Alias-scoped rules
# are not here: Rspamd has no notion of which alias a recipient is, so the
# handler applies those.
#
# 12 is deliberate: above add_header (6) and below reject (15) in actions.conf.
# A blocked sender therefore lands in Spam with the evidence intact rather than
# being refused at SMTP -- the point being that you can see what a blocked
# sender is still sending, and burn the alias if it does not stop.
UNA_SENDER_BLOCK_ADDR {
  type = "from";
  filter = "email:addr";
  map = "http://web:3000/api/rspamd/sender-rules?action=block&type=address";
  score = 12.0;
  description = "Sender blocked in UNA";
}

UNA_SENDER_BLOCK_DOMAIN {
  type = "from";
  filter = "email:domain";
  map = "http://web:3000/api/rspamd/sender-rules?action=block&type=domain";
  score = 12.0;
  description = "Sender domain blocked in UNA";
}

UNA_SENDER_ALLOW_ADDR {
  type = "from";
  filter = "email:addr";
  map = "http://web:3000/api/rspamd/sender-rules?action=allow&type=address";
  score = -10.0;
  description = "Sender allowed in UNA";
}

UNA_SENDER_ALLOW_DOMAIN {
  type = "from";
  filter = "email:domain";
  map = "http://web:3000/api/rspamd/sender-rules?action=allow&type=domain";
  score = -10.0;
  description = "Sender domain allowed in UNA";
}
