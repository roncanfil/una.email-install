# Without this file Rspamd adds no headers at all (`rspamadm configdump
# milter_headers` printed `use []`), so handler.js never saw a score and every
# message it ingested was stored with spam_score = NULL, is_spam = false.
#
# handler.js reads x-spamd-result and x-spam-status; the other two are for
# whoever is reading a raw message during an incident.
#
# There is deliberately no x-spam-flag here: that is not a routine name in
# Rspamd 4.1 (it logs `routine "x-spam-flag" does not exist` and skips it).
# The routine that would emit a flag is `spam-header`, and it adds
# `Deliver-To: Junk`, which nothing in UNA reads.
use = ["x-spamd-result", "x-spam-status", "x-rspamd-queue-id", "authentication-results"];
# Docker's bridge ranges are in options.inc local_addrs, so without this the
# headers would be skipped for every message in the compose stack (and for
# mail submitted by api-server.js through non_smtpd_milters).
skip_local = false;
skip_authenticated = false;
extended_spam_headers = true;
