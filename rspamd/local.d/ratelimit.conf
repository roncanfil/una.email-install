# Rate limiting to prevent SMTP abuse (requires Redis)
rates {
  # Limit per sender IP address
  to = {
    selector = "ip";
    bucket {
      burst = 30;
      rate = "20 / 1min";
    }
  }

  # Limit per sender address
  from = {
    selector = "from";
    bucket {
      burst = 50;
      rate = "30 / 1min";
    }
  }

  # Limit per recipient (prevents address harvesting)
  to_ip = {
    selector = "to";
    bucket {
      burst = 20;
      rate = "10 / 1min";
    }
  }

  # Limit bounces to one recipient (prevents backscatter attacks).
  #
  # No `selector` line, deliberately. `selector` takes a *lua_selectors*
  # expression, and there is no "bounce_to" selector -- Rspamd 4.1 logged
  # "bad ratelimit selector for bounce_to" and then dropped the whole bucket
  # (ratelimit.lua sets `settings.limits[t] = nil` when the selector fails to
  # parse), so this rule has never limited anything. Without it the bucket
  # falls through to ratelimit.lua's own path, which splits the *rule name* on
  # "_" and looks each part up in the plugin's `keywords` table: `bounce`
  # (sender is postmaster/mailer-daemon/empty) plus `to` (the principal
  # recipient). That pair is exactly "bounces to a recipient".
  bounce_to = {
    bucket {
      burst = 5;
      rate = "2 / 1min";
    }
  }
}

whitelisted_rcpts = "postmaster,mailer-daemon";
